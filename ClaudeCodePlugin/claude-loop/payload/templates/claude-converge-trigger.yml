name: Trigger Claude converge routine
# Optional split-loop bridge for CI that outlives a single routine session.
# Setup:
#   1. Create Routine B with an API trigger; add repo secrets
#      CLAUDE_CONVERGE_FIRE_URL and CLAUDE_CONVERGE_TOKEN.
#   2. Replace "CI" below with your CI workflow's `name:`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-converge-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  fire:
    if: >
      (github.event_name == 'workflow_run'
        && startsWith(github.event.workflow_run.head_branch, 'claude/'))
      || (github.event_name == 'pull_request_review'
        && startsWith(github.event.pull_request.head.ref, 'claude/')
        && vars.CLAUDE_RUNNER_LOGIN != ''
        && github.event.review.user.login != vars.CLAUDE_RUNNER_LOGIN)
    runs-on: ubuntu-latest
    steps:
      - name: Fire converger
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_CONVERGE_FIRE_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_CONVERGE_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          REASON: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || 'review-submitted' }}
        run: |
          jq -n --arg text "Converge PR for branch $BRANCH in ${{ github.repository }}. Wake reason: $REASON ($CONCLUSION)." '{text:$text}' \
          | curl -sS --fail-with-body -X POST "$ROUTINE_URL" \
              -H "Authorization: Bearer $ROUTINE_TOKEN" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d @-
