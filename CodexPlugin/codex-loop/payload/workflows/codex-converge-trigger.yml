name: Codex converge trigger
# Re-runs the supported Codex action when CI or a review gives an open Codex PR new work.
on:
  workflow_run:
    workflows: ["CI"]            # <-- set to your CI workflow's name (Actions CI only; Xcode Cloud repos use pull_request status polling in the sweep instead)
    types: [completed]
  pull_request_review:
    types: [submitted]
concurrency:
  group: codex-converge-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: >
      (github.event_name == 'workflow_run'
        && startsWith(github.event.workflow_run.head_branch, 'codex/'))
      || (github.event_name == 'pull_request_review'
        && startsWith(github.event.pull_request.head.ref, 'codex/'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: read
      pull-requests: read
    steps:
      - name: Dispatch the linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          R: ${{ github.repository }}
        run: |
          if ! PR=$(gh pr list -R "$R" --head "$BRANCH" --state open --json number --jq '.[0].number // ""'); then
            echo "::error::Could not find the pull request for $BRANCH"
            exit 1
          fi
          [ -z "$PR" ] && exit 0
          if ! BODY=$(gh pr view "$PR" -R "$R" --json body --jq '.body // ""'); then
            echo "::error::Could not read PR #$PR"
            exit 1
          fi
          N=$(printf '%s\n' "$BODY" | grep -oiE 'closes #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          [ -z "$N" ] && exit 0
          if ! LABELS=$(gh issue view "$N" -R "$R" --json labels --jq '.labels[].name'); then
            echo "::error::Could not inspect linked issue #$N"
            exit 1
          fi
          if printf '%s\n' "$LABELS" | grep -Fxq codex-ready; then
            EXPECTED=codex-ready
          elif printf '%s\n' "$LABELS" | grep -Fxq codex-running; then
            EXPECTED=codex-running
          else
            echo "::notice::Linked issue #$N is not active; ignoring stale converge event"
            exit 0
          fi
          gh workflow run codex-build-trigger.yml -R "$R" \
            -f issue_number="$N" -f expected_label="$EXPECTED"
